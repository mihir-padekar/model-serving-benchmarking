# Prometheus Configuration
# ========================
# Scrapes metrics from both FP32 and INT8 FastAPI servers.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:

  # FP32 Model Server
  - job_name: "api-fp32"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-fp32:8000"]
        labels:
          model_variant: "fp32"

  # INT8 Model Server
  - job_name: "api-int8"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-int8:8000"]
        labels:
          model_variant: "int8"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

